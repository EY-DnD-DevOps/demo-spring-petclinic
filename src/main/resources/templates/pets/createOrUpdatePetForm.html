<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 class="pc-section-title">
    <span class="fa fa-paw me-2" aria-hidden="true"></span>
    <th:block th:if="${pet['new']}" th:text="#{new}">New </th:block>
    <span th:text="#{pet}">Pet</span>
  </h2>

  <div class="pc-card" style="max-width: 680px;">
    <form th:object="${pet}" class="row g-0" method="post">
      <input type="hidden" name="id" th:value="*{id}" />
      <div class="col-12">
        <div class="mb-3 row">
          <label class="col-sm-2 col-form-label fw-semibold" th:text="#{owner}">Owner</label>
          <div class="col-sm-10 d-flex align-items-center">
            <span class="info-value" th:text="${owner?.firstName + ' ' + owner?.lastName}"></span>
          </div>
        </div>
        <input th:replace="~{fragments/inputField :: input ('Name', 'name', 'text')}" />
        <input th:replace="~{fragments/inputField :: input ('Birth Date', 'birthDate', 'date')}" />
        <input th:replace="~{fragments/selectField :: select ('Type', 'type', ${types})}" />
      </div>
      <div class="col-12 d-flex justify-content-end mt-2">
        <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'"
          class="btn btn-primary" type="submit" th:text="${text}">Add Pet</button>
      </div>
    </form>
  </div>

</body>

</html>
