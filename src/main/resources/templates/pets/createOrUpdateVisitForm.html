<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 class="pc-section-title">
    <span class="fa fa-calendar me-2" aria-hidden="true"></span>
    <th:block th:if="${visit['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <!-- Pet info card -->
  <div class="pc-card mb-4" style="max-width: 680px;">
    <div class="pc-card-header">
      <span class="fa fa-paw me-2" aria-hidden="true"></span>
      <span th:text="#{pet}">Pet</span>
    </div>
    <div class="pc-card-body">
      <div class="row g-3">
        <div class="col-sm-3">
          <div class="info-label" th:text="#{name}">Name</div>
          <div class="info-value" th:text="${pet.name}"></div>
        </div>
        <div class="col-sm-3">
          <div class="info-label" th:text="#{birthDate}">Birth Date</div>
          <div class="info-value" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></div>
        </div>
        <div class="col-sm-3">
          <div class="info-label" th:text="#{type}">Type</div>
          <div class="info-value"><span class="badge-specialty" th:text="${pet.type}"></span></div>
        </div>
        <div class="col-sm-3">
          <div class="info-label" th:text="#{owner}">Owner</div>
          <div class="info-value" th:text="${owner?.firstName + ' ' + owner?.lastName}"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Visit form -->
  <div class="pc-card" style="max-width: 680px;">
    <form th:object="${visit}" class="row g-0" method="post">
      <div class="col-12">
        <input th:replace="~{fragments/inputField :: input ('Date', 'date', 'date')}" />
        <input th:replace="~{fragments/inputField :: input ('Description', 'description', 'text')}" />
      </div>
      <div class="col-12 d-flex justify-content-end mt-2">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addVisit}">Add Visit</button>
      </div>
    </form>
  </div>

  <!-- Previous visits -->
  <div th:if="${!pet.visits.isEmpty()}" class="mt-4" style="max-width: 680px;">
    <h2 class="pc-section-title">
      <span class="fa fa-history me-2" aria-hidden="true"></span>
      <span th:text="#{previousVisits}">Previous Visits</span>
    </h2>
    <div style="overflow-x: auto;">
      <table class="table-modern table">
        <thead>
          <tr>
            <th th:text="#{date}">Date</th>
            <th th:text="#{description}">Description</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${!visit['new']}" th:each="petVisit : ${pet.visits}">
            <td th:text="${#temporals.format(petVisit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${petVisit.description}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>

</html>
