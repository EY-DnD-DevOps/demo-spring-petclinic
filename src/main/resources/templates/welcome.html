<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <div class="pc-hero">
    <div class="row align-items-center g-4">
      <div class="col-md-7">
        <h2 th:text="#{welcome}">Welcome</h2>
        <p th:text="#{welcomeSubtitle}">A demonstration of Spring Boot, Spring MVC, and Thymeleaf.</p>
      </div>
      <div class="col-md-5 text-center">
        <img class="pc-hero-img" src="../static/resources/images/pets.png"
          th:src="@{/resources/images/pets.png}" alt="Pets" />
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <div class="pc-card h-100 text-center">
        <div class="mb-3">
          <span class="fa fa-search fa-2x" style="color: var(--pc-primary);" aria-hidden="true"></span>
        </div>
        <h5 class="fw-bold" style="color: var(--pc-primary-dark);" th:text="#{findOwners}">Find Owners</h5>
        <p class="text-muted small" th:text="#{findOwnersDescription}">Search for pet owners by last name.</p>
        <a th:href="@{/owners/find}" class="btn btn-primary btn-sm mt-auto" th:text="#{findOwners}">Find Owners</a>
      </div>
    </div>
    <div class="col-md-4">
      <div class="pc-card h-100 text-center">
        <div class="mb-3">
          <span class="fa fa-th-list fa-2x" style="color: var(--pc-primary);" aria-hidden="true"></span>
        </div>
        <h5 class="fw-bold" style="color: var(--pc-primary-dark);" th:text="#{vets}">Veterinarians</h5>
        <p class="text-muted small" th:text="#{vetsDescription}">Browse the list of veterinarians.</p>
        <a th:href="@{/vets.html}" class="btn btn-primary btn-sm mt-auto" th:text="#{vets}">Veterinarians</a>
      </div>
    </div>
    <div class="col-md-4">
      <div class="pc-card h-100 text-center">
        <div class="mb-3">
          <span class="fa fa-user-plus fa-2x" style="color: var(--pc-primary);" aria-hidden="true"></span>
        </div>
        <h5 class="fw-bold" style="color: var(--pc-primary-dark);" th:text="#{registerOwner}">Register Owner</h5>
        <p class="text-muted small" th:text="#{registerOwnerDescription}">Add a new pet owner.</p>
        <a th:href="@{/owners/new}" class="btn btn-primary btn-sm mt-auto" th:text="#{addOwner}">Add Owner</a>
      </div>
    </div>
  </div>

</body>

</html>
