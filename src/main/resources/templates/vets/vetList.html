<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 class="pc-section-title">
    <span class="fa fa-stethoscope me-2" aria-hidden="true"></span>
    <span th:text="#{vets}">Veterinarians</span>
  </h2>

  <div style="overflow-x: auto;">
    <table id="vets" class="table-modern table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{specialties}">Specialties</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${listVets}">
          <td style="font-weight:500;" th:text="${vet.firstName + ' ' + vet.lastName}"></td>
          <td>
            <th:block th:if="${vet.nrOfSpecialties > 0}">
              <span th:each="specialty : ${vet.specialties}" class="badge-specialty" th:text="${specialty.name}"></span>
            </th:block>
            <span th:if="${vet.nrOfSpecialties == 0}" class="text-muted" th:text="#{none}">none</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${totalPages > 1}" class="pc-pagination">
    <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=1'}"
      th:title="#{first}" th:attr="aria-label=#{first}">
      <span class="fa fa-fast-backward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage > 1}" class="pc-page-num">
      <span class="fa fa-fast-backward" aria-hidden="true"></span>
    </span>
    <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=__${currentPage - 1}__'}"
      th:title="#{previous}" th:attr="aria-label=#{previous}">
      <span class="fa fa-step-backward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage > 1}" class="pc-page-num">
      <span class="fa fa-step-backward" aria-hidden="true"></span>
    </span>

    <th:block th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=__${i}__'}" th:text="${i}"></a>
      <span th:unless="${currentPage != i}" class="pc-page-current" th:text="${i}"></span>
    </th:block>

    <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${currentPage + 1}__'}"
      th:title="#{next}" th:attr="aria-label=#{next}">
      <span class="fa fa-step-forward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage < totalPages}" class="pc-page-num">
      <span class="fa fa-step-forward" aria-hidden="true"></span>
    </span>
    <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${totalPages}__'}"
      th:title="#{last}" th:attr="aria-label=#{last}">
      <span class="fa fa-fast-forward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage < totalPages}" class="pc-page-num">
      <span class="fa fa-fast-forward" aria-hidden="true"></span>
    </span>
  </div>

</body>

</html>
