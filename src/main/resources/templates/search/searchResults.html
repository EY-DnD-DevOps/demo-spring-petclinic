<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'search')}">

<body>

  <h2 class="pc-section-title">
    <span class="fa fa-search me-2" aria-hidden="true"></span>
    <span th:text="#{searchResults}">Search Results</span>
  </h2>

  <p>
    <span th:text="#{searchFor}">Search results for:</span>
    <strong th:text="${query}"></strong>
  </p>

  <!-- Owners Section -->
  <h3 class="pc-section-title mt-4">
    <span class="fa fa-users me-2" aria-hidden="true"></span>
    <span th:text="#{owners}">Owners</span>
  </h3>

  <p th:if="${ownerResults.isEmpty()}" th:text="#{noOwnersFound}">No matching owners found.</p>

  <div th:unless="${ownerResults.isEmpty()}" style="overflow-x: auto;">
    <table class="table-modern table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${ownerResults}">
          <td>
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"
              style="color: var(--pc-primary); font-weight:500; text-decoration:none;"></a>
          </td>
          <td th:text="${owner.address}"></td>
          <td th:text="${owner.city}"></td>
          <td th:text="${owner.telephone}"></td>
          <td>
            <span th:each="pet : ${owner.pets}">
              <span class="badge-specialty" th:text="${pet.name}"></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pets Section -->
  <h3 class="pc-section-title mt-4">
    <span class="fa fa-paw me-2" aria-hidden="true"></span>
    <span th:text="#{pets}">Pets</span>
  </h3>

  <p th:if="${petResults.isEmpty()}" th:text="#{noPetsFound}">No matching pets found.</p>

  <div th:unless="${petResults.isEmpty()}" style="overflow-x: auto;">
    <table class="table-modern table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{type}">Type</th>
          <th th:text="#{birthDate}">Birth Date</th>
          <th th:text="#{owner}">Owner</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="result : ${petResults}">
          <td th:text="${result.pet.name}"></td>
          <td>
            <span class="badge-specialty" th:text="${result.pet.type.name}"></span>
          </td>
          <td th:text="${result.pet.birthDate}"></td>
          <td>
            <a th:href="@{/owners/__${result.owner.id}__}"
              th:text="${result.owner.firstName + ' ' + result.owner.lastName}"
              style="color: var(--pc-primary); font-weight:500; text-decoration:none;"></a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Vets Section -->
  <h3 class="pc-section-title mt-4">
    <span class="fa fa-user-md me-2" aria-hidden="true"></span>
    <span th:text="#{vets}">Veterinarians</span>
  </h3>

  <p th:if="${vetResults.isEmpty()}" th:text="#{noVetsFound}">No matching veterinarians found.</p>

  <div th:unless="${vetResults.isEmpty()}" style="overflow-x: auto;">
    <table class="table-modern table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{specialties}">Specialties</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="vet : ${vetResults}">
          <td>
            <a th:href="@{/vets.html}" th:text="${vet.firstName + ' ' + vet.lastName}"
              style="color: var(--pc-primary); font-weight:500; text-decoration:none;"></a>
          </td>
          <td>
            <span th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
            <span th:each="specialty : ${vet.specialties}">
              <span class="badge-specialty" th:text="${specialty.name}"></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>

</html>
