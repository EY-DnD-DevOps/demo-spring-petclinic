<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<body>
  <form>
    <th:block th:fragment="input (label, name, type)">
      <div th:with="valid=${!#fields.hasErrors(name)}"
        th:class="${valid ? 'mb-3 row' : 'mb-3 row has-validation'}"
        class="mb-3 row">
        <label th:for="${name}" class="col-sm-2 col-form-label fw-semibold" th:text="${label}">Label</label>
        <div class="col-sm-10">
          <div th:switch="${type}">
            <input th:case="'text'"
              th:class="${valid ? 'form-control' : 'form-control is-invalid'}"
              type="text" th:field="*{__${name}__}" />
            <input th:case="'date'"
              th:class="${valid ? 'form-control' : 'form-control is-invalid'}"
              type="date" th:field="*{__${name}__}" />
          </div>
          <th:block th:if="${!valid}">
            <div class="invalid-feedback d-block" th:errors="*{__${name}__}" th:text="#{error}">Error</div>
          </th:block>
        </div>
      </div>
    </th:block>
  </form>
</body>

</html>
