<!DOCTYPE html>

<html th:fragment="layout (template, menu)" xmlns:th="https://www.thymeleaf.org">

<head>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">
  <title th:text="#{layoutTitle}">PetClinic :: a Spring Framework demonstration</title>
  <link th:href="@{/webjars/font-awesome/css/font-awesome.min.css}" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/resources/css/petclinic.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark" role="navigation">
    <div class="container-fluid">
      <a class="navbar-brand" th:href="@{/}">
        <span class="fa fa-paw" aria-hidden="true"></span>
        <span th:text="#{appName}">PetClinic</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
        aria-controls="main-navbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-navbar">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:remove="all">
          <li th:fragment="menuItem (link,active,title,glyph,text)" class="nav-item">
            <a th:class="${active==menu ? 'nav-link active' : 'nav-link'}" th:href="@{__${link}__}"
              th:title="${title}">
              <span th:class="'fa fa-'+${glyph}" aria-hidden="true"></span>
              <span th:text="${text}">Template</span>
            </a>
          </li>
        </ul>

        <ul class="nav navbar-nav me-auto">
          <li th:replace="~{::menuItem ('/','home','home page','home',#{home})}">
            <span class="fa fa-home" aria-hidden="true"></span>
            <span th:text="#{home}">Home</span>
          </li>
          <li th:replace="~{::menuItem ('/owners/find','owners','find owners','search',#{findOwners})}">
            <span class="fa fa-search" aria-hidden="true"></span>
            <span th:text="#{findOwners}">Find owners</span>
          </li>
          <li th:replace="~{::menuItem ('/vets.html','vets','veterinarians','th-list',#{vets})}">
            <span class="fa fa-th-list" aria-hidden="true"></span>
            <span th:text="#{vets}">Veterinarians</span>
          </li>
          <li
            th:replace="~{::menuItem ('/oups','error','trigger a RuntimeException to see how it is handled','exclamation-triangle',#{error})}">
            <span class="fa fa-exclamation-triangle" aria-hidden="true"></span>
            <span th:text="#{error}">Error</span>
          </li>
        </ul>

        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle pc-lang-toggle" href="#" id="langDropdown" role="button"
              data-bs-toggle="dropdown" aria-expanded="false" th:aria-label="#{language}">
              <span class="fa fa-globe me-1" aria-hidden="true"></span>
              <span th:text="${#locale.language.toUpperCase()}">EN</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end pc-lang-menu" aria-labelledby="langDropdown">
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="en"
                  th:classappend="${#locale.language == 'en' ? ' active' : ''}">
                  <span th:text="#{lang.en}">English</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="de"
                  th:classappend="${#locale.language == 'de' ? ' active' : ''}">
                  <span th:text="#{lang.de}">Deutsch</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="es"
                  th:classappend="${#locale.language == 'es' ? ' active' : ''}">
                  <span th:text="#{lang.es}">Español</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="fa"
                  th:classappend="${#locale.language == 'fa' ? ' active' : ''}">
                  <span th:text="#{lang.fa}">فارسی</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="ko"
                  th:classappend="${#locale.language == 'ko' ? ' active' : ''}">
                  <span th:text="#{lang.ko}">한국어</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="pt"
                  th:classappend="${#locale.language == 'pt' ? ' active' : ''}">
                  <span th:text="#{lang.pt}">Português</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="ru"
                  th:classappend="${#locale.language == 'ru' ? ' active' : ''}">
                  <span th:text="#{lang.ru}">Русский</span>
                </a>
              </li>
              <li>
                <a class="dropdown-item lang-item" href="#" data-lang="tr"
                  th:classappend="${#locale.language == 'tr' ? ' active' : ''}">
                  <span th:text="#{lang.tr}">Türkçe</span>
                </a>
              </li>
            </ul>
          </li>
        </ul>

      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="container xd-container">
      <th:block th:insert="${template}" />
      <div class="row mt-4">
        <div class="col-12 text-center">
          <img src="../static/images/spring-logo.svg" th:src="@{/resources/images/spring-logo.svg}"
            alt="VMware Tanzu Logo" class="logo">
        </div>
      </div>
    </div>
  </div>

  <footer class="pc-footer">
    &copy; <span th:text="${T(java.time.Year).now().value}">2025</span> Spring PetClinic &mdash; Built with Spring Boot &amp; Thymeleaf
  </footer>

  <script th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
  <script>
    document.querySelectorAll('.lang-item').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        var lang = this.getAttribute('data-lang');
        var url = new URL(window.location.href);
        url.searchParams.set('lang', lang);
        window.location.href = url.toString();
      });
    });
  </script>

</body>

</html>
