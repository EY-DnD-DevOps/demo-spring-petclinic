<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <div th:if="${message}" class="alert alert-success alert-dismissible fade show mb-3" id="success-message">
    <span class="fa fa-check-circle me-2" aria-hidden="true"></span>
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mb-3" id="error-message">
    <span class="fa fa-exclamation-circle me-2" aria-hidden="true"></span>
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>

  <h2 class="pc-section-title">
    <span class="fa fa-user me-2" aria-hidden="true"></span>
    <span th:text="#{ownerInformation}">Owner Information</span>
  </h2>

  <!-- Owner info card -->
  <div class="owner-info-card mb-4" th:object="${owner}">
    <div class="pc-card-header">
      <span class="fa fa-id-card me-2" aria-hidden="true"></span>
      <span th:text="*{firstName + ' ' + lastName}">Owner Name</span>
    </div>
    <div class="pc-card-body">
      <div class="row g-3">
        <div class="col-sm-6 col-md-3">
          <div class="info-label" th:text="#{address}">Address</div>
          <div class="info-value" th:text="*{address}"></div>
        </div>
        <div class="col-sm-6 col-md-3">
          <div class="info-label" th:text="#{city}">City</div>
          <div class="info-value" th:text="*{city}"></div>
        </div>
        <div class="col-sm-6 col-md-3">
          <div class="info-label" th:text="#{telephone}">Telephone</div>
          <div class="info-value" th:text="*{telephone}"></div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary btn-sm">
          <span class="fa fa-pencil me-1" aria-hidden="true"></span>
          <span th:text="#{editOwner}">Edit Owner</span>
        </a>
        <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary btn-sm">
          <span class="fa fa-plus me-1" aria-hidden="true"></span>
          <span th:text="#{addNewPet}">Add New Pet</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Pets & Visits -->
  <h2 class="pc-section-title">
    <span class="fa fa-paw me-2" aria-hidden="true"></span>
    <span th:text="#{petsAndVisits}">Pets and Visits</span>
  </h2>

  <div th:each="pet : ${owner.pets}" class="pet-card">
    <div class="pet-card-header">
      <span class="fa fa-paw" aria-hidden="true"></span>
      <span th:text="${pet.name}">Pet Name</span>
      <span class="badge-specialty ms-2" th:text="${pet.type}"></span>
      <span class="ms-auto text-muted" style="font-size:0.82rem; font-weight:400;">
        <span th:text="#{birthDate}">Born</span>:
        <span th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></span>
      </span>
    </div>
    <div class="pet-card-body">
      <table class="visit-table w-100" th:if="${!pet.visits.isEmpty()}">
        <thead>
          <tr>
            <th th:text="#{visitDate}">Visit Date</th>
            <th th:text="#{description}">Description</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="visit : ${pet.visits}">
            <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${visit?.description}"></td>
          </tr>
        </tbody>
      </table>
      <p th:if="${pet.visits.isEmpty()}" class="text-muted small mb-2" th:text="#{noVisits}">No visits recorded yet.</p>
      <div class="mt-2 d-flex gap-2">
        <a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" class="visit-action-link">
          <span class="fa fa-pencil me-1" aria-hidden="true"></span>
          <span th:text="#{editPet}">Edit Pet</span>
        </a>
        <a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" class="visit-action-link ms-3">
          <span class="fa fa-calendar-plus-o me-1" aria-hidden="true"></span>
          <span th:text="#{addVisit}">Add Visit</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var sm = document.getElementById('success-message');
      var em = document.getElementById('error-message');
      if (sm) setTimeout(function () { sm.style.display = 'none'; }, 3000);
      if (em) setTimeout(function () { em.style.display = 'none'; }, 3000);
    })();
  </script>

</body>

</html>
