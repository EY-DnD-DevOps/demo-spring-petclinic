<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 class="pc-section-title">
    <span class="fa fa-users me-2" aria-hidden="true"></span>
    <span th:text="#{owners}">Owners</span>
  </h2>

  <div style="overflow-x: auto;">
    <table id="owners" class="table-modern table">
      <thead>
        <tr>
          <th th:text="#{name}">Name</th>
          <th th:text="#{address}">Address</th>
          <th th:text="#{city}">City</th>
          <th th:text="#{telephone}">Telephone</th>
          <th th:text="#{pets}">Pets</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="owner : ${listOwners}">
          <td>
            <a th:href="@{/owners/__${owner.id}__}" th:text="${owner.firstName + ' ' + owner.lastName}"
              style="color: var(--pc-primary); font-weight:500; text-decoration:none;"></a>
          </td>
          <td th:text="${owner.address}"></td>
          <td th:text="${owner.city}"></td>
          <td th:text="${owner.telephone}"></td>
          <td>
            <span th:each="pet,iterStat : ${owner.pets}">
              <span class="badge-specialty" th:text="${pet.name}"></span>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div th:if="${totalPages > 1}" class="pc-pagination">
    <a th:if="${currentPage > 1}" th:href="@{'/owners?page=1'}"
      th:title="#{first}" th:attr="aria-label=#{first}">
      <span class="fa fa-fast-backward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage > 1}" class="pc-page-num">
      <span class="fa fa-fast-backward" aria-hidden="true"></span>
    </span>
    <a th:if="${currentPage > 1}" th:href="@{'/owners?page=__${currentPage - 1}__'}"
      th:title="#{previous}" th:attr="aria-label=#{previous}">
      <span class="fa fa-step-backward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage > 1}" class="pc-page-num">
      <span class="fa fa-step-backward" aria-hidden="true"></span>
    </span>

    <th:block th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/owners?page=' + ${i}}" th:text="${i}"></a>
      <span th:unless="${currentPage != i}" class="pc-page-current" th:text="${i}"></span>
    </th:block>

    <a th:if="${currentPage < totalPages}" th:href="@{'/owners?page=__${currentPage + 1}__'}"
      th:title="#{next}" th:attr="aria-label=#{next}">
      <span class="fa fa-step-forward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage < totalPages}" class="pc-page-num">
      <span class="fa fa-step-forward" aria-hidden="true"></span>
    </span>
    <a th:if="${currentPage < totalPages}" th:href="@{'/owners?page=__${totalPages}__'}"
      th:title="#{last}" th:attr="aria-label=#{last}">
      <span class="fa fa-fast-forward" aria-hidden="true"></span>
    </a>
    <span th:unless="${currentPage < totalPages}" class="pc-page-num">
      <span class="fa fa-fast-forward" aria-hidden="true"></span>
    </span>
  </div>

</body>

</html>
