<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search - PetClinic</title>
  <link rel="shortcut icon" href="/resources/images/favicon.png">
  <link rel="stylesheet" href="/webjars/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/resources/css/petclinic.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="container-fluid">
    <div class="container xd-container">
      <div id="alert-container"></div>
      <div class="mb-4">
        <h1 class="pc-section-title">Global Search</h1>
        <p id="search-summary" class="text-muted mb-0">Search across owners, pets, and veterinarians.</p>
      </div>
      <div class="row g-4">
        <div class="col-12">
          <div class="pc-card">
            <h2>Owners</h2>
            <div id="owners-results"></div>
          </div>
        </div>
        <div class="col-12">
          <div class="pc-card">
            <h2>Pets</h2>
            <div id="pets-results"></div>
          </div>
        </div>
        <div class="col-12">
          <div class="pc-card">
            <h2>Veterinarians</h2>
            <div id="vets-results"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="pc-footer">
    &copy; 2025 Spring PetClinic
  </footer>
  <script src="/webjars/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
