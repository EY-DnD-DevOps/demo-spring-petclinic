<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Form - PetClinic</title>
  <link rel="shortcut icon" href="/resources/images/favicon.png">
  <link rel="stylesheet" href="/webjars/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/resources/css/petclinic.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="container-fluid">
    <div class="container xd-container">
      <div id="alert-container"></div>
      <div class="pc-card">
        <div class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap">
          <div>
            <h1 id="page-title" class="pc-section-title">Create Owner</h1>
            <p id="page-description" class="text-muted mb-0">Register a new owner in PetClinic.</p>
          </div>
          <a class="btn btn-outline-secondary" href="/owners.html">Back to Owners</a>
        </div>
        <form id="owner-form" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="firstName">First Name</label>
            <input class="form-control" id="firstName" name="firstName" type="text" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="lastName">Last Name</label>
            <input class="form-control" id="lastName" name="lastName" type="text" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="address">Address</label>
            <input class="form-control" id="address" name="address" type="text" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="city">City</label>
            <input class="form-control" id="city" name="city" type="text" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="telephone">Telephone</label>
            <input class="form-control" id="telephone" name="telephone" type="text" required>
          </div>
          <div class="col-12">
            <button id="submit-button" class="btn btn-primary" type="submit">Create Owner</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <footer class="pc-footer">
    &copy; 2025 Spring PetClinic
  </footer>
  <script src="/webjars/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/owner-form.js"></script>
</body>
</html>
